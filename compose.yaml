services:
  kapusta:
    build: .
    container_name: kapusta2-pyservice
    restart: unless-stopped
    volumes:
      - ./.env:/usr/src/app/.env:z
      - ./:/usr/src/app:z       # для разработки: монтирует код внутрь контейнера
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - APP_URL=${APP_URL}
      - TZ=${TZ:-Europe/Minsk}
    ports:
      - "8089:8000"
    working_dir: /usr/src/app
    command: ${COMMAND:-python3 ./app.py}  # можно переопределить через переменную окружения
